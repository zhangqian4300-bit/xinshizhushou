# Docker Compose 配置
# 用于本地开发和测试

version: '3.8'

services:
  # MongoDB 服务
  mongo:
    image: mongo:6
    container_name: xinshi-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 心石清理师 Agent
  xinshi-agent:
    build: .
    container_name: xinshi-agent
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password123@mongo:27017/xinshi-assistant?authSource=admin
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      # OpenClaw Gateway 配置（根据实际情况修改）
      - OPENCLAW_GATEWAY_PORT=19000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data: